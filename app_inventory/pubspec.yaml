name: app_inventory
description: SIMS (Sistem Inventory Management Scitech), aplikasi inventaris dan peminjaman Scitech.
publish_to: none
version: 1.0.0+3
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.3
  image: ^4.12.0
  shared_preferences: ^2.5.6
  dynamic_color: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Fakes the photo picker in the item photo test.
  image_picker_platform_interface: ^2.11.1
flutter:
  uses-material-design: true
  assets:
    - assets/brand/sims-symbol.png
    - assets/brand/sims-symbol-white.png
    - assets/brand/sims-symbol-small.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-SemiBold.ttf
          weight: 600
