include: package:flutter_lints/flutter.yaml
# Historical prototype remains available for review, but is not imported by main.dart.
analyzer:
  exclude:
    - lib/data/**
    - lib/pages/**
    - lib/widgets/**
    - lib/services/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
