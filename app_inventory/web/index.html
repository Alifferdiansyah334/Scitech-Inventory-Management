<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Replaced by the `--base-href` argument of `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inventaris dan peminjaman barang internal Scitech.">
  <meta name="theme-color" content="#0F2C59">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SIMS Scitech</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown until Flutter paints its first frame; matches the in-app restoring screen. */
    html, body { margin: 0; height: 100%; background: #0F2C59; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      color: #FFFFFF; font: 600 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity 240ms ease-out;
    }
    #splash img { height: 72px; width: 72px; border-radius: 20px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #1D3F73; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #FFFFFF;
      animation: load 1.1s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
    body.ready #splash { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Inventaris Scitech</span>
    <div class="bar" aria-label="Memuat aplikasi"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('ready');
      setTimeout(function () {
        var splash = document.getElementById('splash');
        if (splash) splash.remove();
      }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
